<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <rect width="390" height="844" fill="#FFF7ED"/>
  <!-- blobs -->
  <circle cx="60" cy="40" r="140" fill="#FF8918" fill-opacity="0.28"/>
  <circle cx="340" cy="320" r="150" fill="#FF9710" fill-opacity="0.2"/>
  <circle cx="120" cy="720" r="120" fill="#D55200" fill-opacity="0.12"/>
  <!-- accent square -->
  <rect x="300" y="110" width="56" height="56" rx="14" transform="rotate(12 328 138)" stroke="#FF8918" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  <!-- progress -->
  <rect x="165" y="56" width="28" height="8" rx="4" fill="#FF8918"/>
  <circle cx="208" cy="60" r="4" fill="#FF8918" fill-opacity="0.3"/>
  <circle cx="224" cy="60" r="4" fill="#FF8918" fill-opacity="0.3"/>
  <!-- type -->
  <text x="195" y="108" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#D55200">ROUNDTABLE</text>
  <text x="195" y="168" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, sans-serif" font-size="42" font-weight="700" fill="#1A1410">Can We Talk?</text>
  <text x="40" y="210" font-family="Nunito, Arial, sans-serif" font-size="15" fill="#1A1410" fill-opacity="0.7">
    <tspan x="40" dy="0">Come as you are. A warm, anonymous</tspan>
    <tspan x="40" dy="22">space for hard questions, heavy days,</tspan>
    <tspan x="40" dy="22">and honest faith.</tspan>
  </text>
  <!-- cards -->
  <g filter="url(#shadow)">
    <rect x="24" y="300" width="164" height="130" rx="20" fill="#FFFFFF"/>
    <rect x="202" y="300" width="164" height="130" rx="20" fill="#FFFFFF"/>
  </g>
  <text x="44" y="330" font-family="Fredoka, sans-serif" font-size="13" font-weight="700" fill="#D55200">WHY WE'RE HERE</text>
  <text x="44" y="356" font-family="Nunito, sans-serif" font-size="13" fill="#1A1410" fill-opacity="0.65">
    <tspan x="44" dy="0">No performance. No</tspan>
    <tspan x="44" dy="18">judgment. Just real</tspan>
    <tspan x="44" dy="18">conversation.</tspan>
  </text>
  <text x="222" y="330" font-family="Fredoka, sans-serif" font-size="13" font-weight="700" fill="#D55200">HOW IT WORKS</text>
  <text x="222" y="356" font-family="Nunito, sans-serif" font-size="13" fill="#1A1410" fill-opacity="0.65">
    <tspan x="222" dy="0">Pick what's on your</tspan>
    <tspan x="222" dy="18">mind  then talk</tspan>
    <tspan x="222" dy="18">one-to-one.</tspan>
  </text>
  <!-- CTA -->
  <g filter="url(#ctaShadow)">
    <rect x="95" y="470" width="200" height="52" rx="16" fill="#FF8918"/>
  </g>
  <text x="195" y="502" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="16" font-weight="600" fill="#1A1410">Start talking �</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#D55200" flood-opacity="0.18"/>
    </filter>
    <filter id="ctaShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF8918" flood-opacity="0.45"/>
    </filter>
  </defs>
</svg>
